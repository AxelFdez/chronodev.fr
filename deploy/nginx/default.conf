# Sert l'export statique de Next (out/). TLS terminé en amont par Traefik (Dokploy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;  # derrière Traefik : redirections relatives, pas http://hôte:80

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml text/plain image/svg+xml;

    # add_header ne s'hérite pas dans un location qui en déclare un : chaque location
    # inclut donc tout le jeu d'en-têtes.

    location /_next/static/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
